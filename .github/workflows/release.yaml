name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Upload dist to release
        run: gh release upload ${{ github.ref_name }} dist/ios-button-card.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
